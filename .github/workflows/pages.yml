name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  battleship:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/battleship
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/battleship/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx vitest run
      - run: npx vite build
      - run: node scripts/size.mjs
      - run: npx playwright install --with-deps chromium webkit
      - run: npx playwright test
        env:
          CI: '1'
          NET: '0'
          WEBKIT: '1'
      - uses: actions/upload-artifact@v4
        with:
          name: battleship
          path: apps/battleship/dist

  site:
    needs: battleship
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      # Jekyll runs in a root-owned container, so assemble the artifact in a fresh directory.
      - uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site
      - uses: actions/download-artifact@v4
        with:
          name: battleship
          path: battleship-dist
      - run: |
          mkdir out
          cp -r _site/. out/
          cp -r battleship-dist out/battleship
          echo "$GITHUB_SHA" > out/battleship/version.txt
          # Old URL from before talks/ existed; it is already shared.
          cp out/talks/mellum2.1.pdf out/mellum2.1.pdf
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: site
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
